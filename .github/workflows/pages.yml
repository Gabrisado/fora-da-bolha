name: Publicar Fora da bolha
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Recuperar último snapshot válido
        uses: actions/cache/restore@v4
        with:
          path: |
            public/data/news.json
            public/news-media
          key: news-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-
      - name: Atualizar notícias e imagens autorizadas
        id: collect
        run: npm run update:news && npm run prepare:news
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1
      - name: Guardar snapshot validado
        if: steps.collect.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            public/data/news.json
            public/news-media
          key: news-${{ github.run_id }}-${{ github.run_attempt }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
